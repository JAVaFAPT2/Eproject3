name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VehicleShowroomManagement/VehicleShowroomManagement.sln

      - name: Build
        run: dotnet build VehicleShowroomManagement/VehicleShowroomManagement.sln --configuration Release --no-restore

      - name: Test
        run: |
          if [ -d "VehicleShowroomManagement/tests" ]; then
            dotnet test VehicleShowroomManagement/tests/VehicleShowroomManagement.Tests.csproj --configuration Release --no-build --verbosity normal
          else
            echo "No tests project found. Skipping tests."
          fi

      - name: Docker Build Test
        run: |
          docker build -t vehicleshowroom-test .
          echo "Docker build successful"


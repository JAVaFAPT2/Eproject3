services:
  # Backend API
  - type: web
    name: eproject3-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__MongoDB
        fromDatabase:
          name: eproject3-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: VehicleShowroomAPI
      - key: Jwt__Audience
        value: VehicleShowroomClient
      - key: EmailSettings__SmtpHost
        value: smtp.gmail.com
      - key: EmailSettings__SmtpPort
        value: 587
      - key: EmailSettings__SmtpUsername
        sync: false
      - key: EmailSettings__SmtpPassword
        sync: false
      - key: EmailSettings__FromEmail
        value: noreply@vehicleshowroom.com
      - key: EmailSettings__FromName
        value: Vehicle Showroom Management
      - key: CloudinarySettings__CloudName
        sync: false
      - key: CloudinarySettings__ApiKey
        sync: false
      - key: CloudinarySettings__ApiSecret
        sync: false

  # Frontend Web App
  - type: web
    name: eproject3-web
    env: docker
    dockerfilePath: ./VehicleShowroom/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: eproject3-api
          property: host
          format: https://${host}/api
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: eproject3-api
          property: host
          format: https://${host}
      - key: REACT_APP_NAME
        value: Vehicle Showroom Management
      - key: REACT_APP_VERSION
        value: 2.0.0
      - key: REACT_APP_ENVIRONMENT
        value: production

databases:
  - name: eproject3-db
    plan: free
    databaseName: vehicleshowroom
    user: vehicleshowroom_user
